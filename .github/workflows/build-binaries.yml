name: Build binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: arkts-fmt-x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: arkts-fmt-x86_64-apple-darwin
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: arkts-fmt-aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: arkts-fmt-x86_64-pc-windows-msvc
            exe: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          target_dir="target/${{ matrix.target }}/release"
          binary="${target_dir}/arkts-fmt${{ matrix.exe }}"
          asset="${{ matrix.asset }}"

          cp "$binary" "dist/${asset}${{ matrix.exe }}"
          chmod +x "dist/${asset}${{ matrix.exe }}" || true
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}${{ matrix.exe }}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
          fi

          ls -lh dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5
        with:
          artifacts: dist/*.tar.gz,dist/*.sha256
          generateReleaseNotes: true
